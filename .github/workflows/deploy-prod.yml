name: Deploy to Production

on:
    push:
        branches:
            - prod

jobs:
    deploy:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: bblog_ci
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Create .env file for CI
              run: |
                  cat > .env << 'EOF'
                  DATABASE_HOST=127.0.0.1
                  DATABASE_PORT=3306
                  DATABASE_USERNAME=root
                  DATABASE_PASSWORD=root
                  DATABASE_NAME=bblog_ci
                  EOF

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install tsx for migration
              run: pnpm add -D tsx

            - name: Run database migrations
              run: pnpm exec tsx scripts/db-migrate.ts

            - name: Build application
              run: pnpm build

            - name: Create production .env file
              run: echo "${{ secrets.BBLOG_ENV_TEXT }}" > .env

            - name: Build Docker image
              run: docker build -t bblog:latest .

            - name: Save Docker image to tar
              run: |
                  docker save bblog:latest -o bblog.tar
                  chmod 644 bblog.tar

            - name: Transfer files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.AWS_KR_ADDRESS }}
                  username: ${{ secrets.AWS_KR_USERNAME }}
                  key: ${{ secrets.AWS_KR_PEM }}
                  source: 'bblog.tar,compose.yml,.env'
                  target: '~/bblog-deploy'

            - name: Deploy on server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.AWS_KR_ADDRESS }}
                  username: ${{ secrets.AWS_KR_USERNAME }}
                  key: ${{ secrets.AWS_KR_PEM }}
                  script: |
                      mkdir -p ~/bblog-deploy
                      cd ~/bblog-deploy
                      docker load -i bblog.tar
                      docker compose down
                      docker compose up -d
                      docker ps | grep bblog
                      echo "Deployment completed successfully"

                      echo "Waiting for application to be ready..."
                      sleep 10

                      echo "Revalidating cache tags..."
                      curl -X POST http://localhost:7777/api/revalidate \
                        -H "Content-Type: application/json" \
                        -d '{"tags": ["tagList", "categoryList", "mainPostLists"]}' \
                        || echo "Tag revalidation failed (non-critical)"

                      echo "Revalidating main page..."
                      curl -X POST http://localhost:7777/api/revalidate/path \
                        -H "Content-Type: application/json" \
                        -d '{"path": "/"}' \
                        || echo "Path revalidation failed (non-critical)"

                      echo "Cache revalidation completed"
